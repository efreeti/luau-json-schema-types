name: Release to Wally
run-name: Release ${{ inputs.release_version }} and prepare ${{ inputs.next_version }}
on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Version to publish (for example, 1.0.0)'
        required: true
        type: string
      next_version:
        description: 'Next development version (for example, 1.0.1-dev.0)'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: wally-release
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    env:
      RELEASE_VERSION: ${{ inputs.release_version }}
      NEXT_VERSION: ${{ inputs.next_version }}
    steps:
      - name: Require main branch
        env:
          SELECTED_REF: ${{ github.ref }}
        run: |
          if [[ "$SELECTED_REF" != refs/heads/main ]]; then
            echo 'Run this workflow from main.' >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate versions and release tag
        run: |
          python3 scripts/version.py validate "$RELEASE_VERSION" "$NEXT_VERSION"
          if git show-ref --verify --quiet "refs/tags/v$RELEASE_VERSION"; then
            echo "Tag v$RELEASE_VERSION already exists. Check the previous release before retrying." >&2
            exit 1
          fi
      - name: Require Wally authentication
        env:
          WALLY_AUTH_TOKEN: ${{ secrets.WALLY_AUTH_TOKEN }}
        run: test -n "$WALLY_AUTH_TOKEN"
      - run: bash scripts/install-tools.sh
      - name: Set release version
        run: python3 scripts/version.py set "$RELEASE_VERSION" --update-readme
      - name: Verify release
        run: |
          python3 scripts/check.py --luau .tools/luau --analyzer .tools/luau-analyze
          python3 scripts/check-package.py .tools/wally
      - name: Commit and tag release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wally.toml package.json README.md
          git commit --allow-empty -m "Release $RELEASE_VERSION"
          git tag -a "v$RELEASE_VERSION" -m "Release $RELEASE_VERSION"
          git push --atomic origin HEAD:refs/heads/main "refs/tags/v$RELEASE_VERSION"
      - name: Publish release to Wally
        env:
          WALLY_AUTH_TOKEN: ${{ secrets.WALLY_AUTH_TOKEN }}
        run: |
          .tools/wally login --token "$WALLY_AUTH_TOKEN"
          .tools/wally publish | tee "$RUNNER_TEMP/wally-publish.log"
          grep -Fq 'Package published successfully!' "$RUNNER_TEMP/wally-publish.log"
      - name: Set and commit next development version
        run: |
          python3 scripts/version.py set "$NEXT_VERSION"
          git add wally.toml package.json
          git commit -m "Prepare development version $NEXT_VERSION"
          git push origin HEAD:refs/heads/main
      - name: Release summary
        run: |
          {
            echo "Published efreeti/json-schema-types@$RELEASE_VERSION."
            echo "Release tag: v$RELEASE_VERSION."
            echo "main now uses $NEXT_VERSION."
          } >> "$GITHUB_STEP_SUMMARY"
