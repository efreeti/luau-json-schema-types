name: Release to npm
run-name: Release ${{ inputs.release_version }} and prepare ${{ inputs.next_version }}
on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Version to stage for approval (for example, 1.1.0)'
        required: true
        type: string
      next_version:
        description: 'Next development version (for example, 1.0.1-dev.0)'
        required: true
        type: string
permissions:
  contents: write
  id-token: write
concurrency:
  group: npm-release
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    env:
      RELEASE_VERSION: ${{ inputs.release_version }}
      NEXT_VERSION: ${{ inputs.next_version }}
    steps:
      - name: Require main branch
        env:
          SELECTED_REF: ${{ github.ref }}
        run: |
          if [[ "$SELECTED_REF" != refs/heads/main ]]; then
            echo 'Run this workflow from main.' >&2
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Ensure npm supports staged trusted publishing
        run: npm install --global npm@^11.15.0
      - name: Install Rust for npmluau
        run: rustup toolchain install 1.94.0 --profile minimal --target wasm32-unknown-unknown
      - name: Install npm dependencies
        env:
          RUSTUP_TOOLCHAIN: '1.94.0'
        run: npm ci
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate versions and release tag
        run: |
          python3 scripts/version.py validate "$RELEASE_VERSION" "$NEXT_VERSION"
          if git show-ref --verify --quiet "refs/tags/v$RELEASE_VERSION"; then
            echo "Tag v$RELEASE_VERSION already exists. Check the previous release before retrying." >&2
            exit 1
          fi
      - run: bash scripts/install-tools.sh
      - name: Set release version
        run: python3 scripts/version.py set "$RELEASE_VERSION" --update-readme
      - name: Verify release
        run: |
          python3 scripts/check.py --luau .tools/luau --analyzer .tools/luau-analyze
          python3 scripts/check-package.py --luau .tools/luau --analyzer .tools/luau-analyze
      - name: Commit and tag release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json README.md
          git commit --allow-empty -m "Release $RELEASE_VERSION"
          git tag -a "v$RELEASE_VERSION" -m "Release $RELEASE_VERSION"
          git push --atomic origin HEAD:refs/heads/main "refs/tags/v$RELEASE_VERSION"
      - name: Stage release on npm with OIDC
        run: (cd build/package && npm stage publish)
      - name: Set and commit next development version
        run: |
          python3 scripts/version.py set "$NEXT_VERSION"
          git add package.json package-lock.json
          git commit -m "Prepare development version $NEXT_VERSION"
          git push origin HEAD:refs/heads/main
      - name: Release summary
        run: |
          {
            echo "Staged @efreeti/luau-json-schema-types@$RELEASE_VERSION; awaiting approval."
            echo "Review and approve with 2FA in npm's Staged Packages tab."
            echo "The version is not publicly available until approved."
            echo "Release tag: v$RELEASE_VERSION."
            echo "main now uses $NEXT_VERSION."
          } >> "$GITHUB_STEP_SUMMARY"
